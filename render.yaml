# Render Blueprint for StudyForge AI.
# Creates: a free PostgreSQL database, the FastAPI web service and the React static site.
# No secrets are stored here; DATABASE_URL is injected from the database resource.
databases:
  - name: studyforge-db
    plan: free
    databaseName: studyforge
    user: studyforge

services:
  - type: web
    name: studyforge-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --timeout-keep-alive 30
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: studyforge-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        # Update if the static site gets a different URL or a custom domain.
        value: https://studyforge-web.onrender.com
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: ENABLE_DOCS
        value: "true"

  - type: web
    name: studyforge-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://studyforge-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
